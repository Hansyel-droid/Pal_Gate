{% extends 'base.html' %}
{% block title %}Sign In — PalawanSU Gate System{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-col">

        <div class="auth-head">
            <div class="auth-mark" aria-hidden="true">
                <svg class="ic" aria-hidden="true"><use href="#i-barrier"/></svg>
            </div>
            <h1>PalawanSU Gate System</h1>
            <p>Vehicle sticker applications, issuance, and gate records.</p>
        </div>

        <div class="card auth-card">
            <div class="card-body">
                <h2>Sign in</h2>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input id="id_username" type="text" name="username" class="form-control"
                               autocomplete="username"
                               required autofocus placeholder="Enter your username">
                    </div>
                    <div class="mb-2">
                        <label for="id_password" class="form-label">Password</label>
                        <input id="id_password" type="password" name="password" class="form-control"
                               autocomplete="current-password"
                               required placeholder="Enter your password">
                    </div>
                    <div class="text-end mb-4">
                        <a href="{% url 'password_reset' %}" class="field-link">
                            Forgot your password?
                        </a>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Sign in
                        <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg>
                    </button>
                </form>
            </div>
        </div>

        <p class="auth-alt">
            New applicant?
            <a href="{% url 'register' %}">Create an account</a>
        </p>

    </div>
</div>
{% endblock %}
