{% extends 'base.html' %}
{% block title %}Reset Email Sent{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-col">
        <div class="card auth-card">
            <div class="card-body text-center">
                <div class="auth-mark" aria-hidden="true">
                    <svg class="ic" aria-hidden="true"><use href="#i-mail-check"/></svg>
                </div>
                <h1>Check your email</h1>
                <p class="mt-2 mb-4" style="font-size:var(--fs-xs); color:var(--text-muted);">
                    If an account exists with that email address, a password reset
                    link is on its way.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    Back to sign in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
