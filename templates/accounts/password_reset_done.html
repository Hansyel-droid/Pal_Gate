{% extends 'base.html' %}
{% block title %}Reset Email Sent{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 56px); display:flex; align-items:center;
            justify-content:center; padding:40px 16px;">
    <div style="width:100%; max-width:420px;">
        <div class="card">
            <div class="card-body" style="padding:36px; text-align:center;">
                <i class="bi bi-envelope-check-fill"
                   style="font-size:2.5rem; color:var(--success);
                          display:block; margin-bottom:16px;" aria-hidden="true"></i>
                <h5 style="font-weight:700; margin-bottom:8px;">Check your email</h5>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:24px;">
                    If an account exists with that email, you'll receive a
                    password reset link shortly.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
