{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-col">
        <div class="card auth-card">
            <div class="card-body text-center">
                <div class="auth-mark success" aria-hidden="true">
                    <svg class="ic" aria-hidden="true"><use href="#i-check-circle"/></svg>
                </div>
                <h1>Password changed</h1>
                <p class="mt-2 mb-4" style="font-size:var(--fs-xs); color:var(--text-muted);">
                    Your new password is set. You can sign in with it now.
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary">
                    <svg class="ic" aria-hidden="true"><use href="#i-login"/></svg>
                    Sign in
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
