{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 56px); display:flex; align-items:center;
            justify-content:center; padding:40px 16px;">
    <div style="width:100%; max-width:420px;">
        <div class="card">
            <div class="card-body" style="padding:36px; text-align:center;">
                <i class="bi bi-check-circle-fill"
                   style="font-size:2.5rem; color:var(--success);
                          display:block; margin-bottom:16px;"></i>
                <h5 style="font-weight:700; margin-bottom:8px;">
                    Password changed!
                </h5>
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:24px;">
                    Your password has been set. You can now log in with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-gold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
