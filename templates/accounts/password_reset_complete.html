{% extends 'base.html' %}
{% block title %}Password Changed — PalawanSU Gate System{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-col">

        <div class="auth-head">
            <div class="auth-mark success" aria-hidden="true">
                <svg class="ic" aria-hidden="true"><use href="#i-check-circle"/></svg>
            </div>
            <h1>Password changed</h1>
            <p>Your new password is set. Sign in with it now.</p>
        </div>

        <div class="card auth-card">
            <div class="card-body">
                <a href="{% url 'login' %}" class="btn btn-primary btn-lg w-100">
                    Sign in
                    <svg class="ic" aria-hidden="true"><use href="#i-arrow-right"/></svg>
                </a>
            </div>
        </div>

        <p class="auth-alt">
            Didn't do this? Tell us at once —
            <a href="mailto:{{ support_email }}">{{ support_email }}</a>
        </p>
    </div>
</div>
{% endblock %}
