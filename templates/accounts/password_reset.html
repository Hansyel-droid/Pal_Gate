{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 56px); display:flex; align-items:center;
            justify-content:center; padding:40px 16px;">
    <div style="width:100%; max-width:420px;">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-key me-2" style="color:var(--gold);"></i>
                Reset Your Password
            </div>
            <div class="card-body" style="padding:28px;">
                <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control"
                               required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Send Reset Link <i class="bi bi-send ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
        <p class="text-center mt-3" style="font-size:0.83rem; color:var(--text-muted);">
            <a href="{% url 'login' %}" style="color:var(--navy-mid); font-weight:600;">
                <i class="bi bi-arrow-left me-1"></i> Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
