{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-col">

        <div class="auth-head">
            <div class="auth-mark" aria-hidden="true">
                <svg class="ic" aria-hidden="true"><use href="#i-key"/></svg>
            </div>
            <h1>Reset your password</h1>
            <p>Enter your email address and we'll send you a link to set a new one.</p>
        </div>

        <div class="card auth-card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_email" class="form-label">Email address</label>
                        <input id="id_email" type="email" name="email" class="form-control"
                               autocomplete="email"
                               required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        Send reset link
                        <svg class="ic" aria-hidden="true"><use href="#i-send"/></svg>
                    </button>
                </form>
            </div>
        </div>

        <p class="auth-alt">
            <a href="{% url 'login' %}">
                <svg class="ic" aria-hidden="true"><use href="#i-arrow-left"/></svg>
                Back to sign in
            </a>
        </p>
    </div>
</div>
{% endblock %}
